# nginx config for the static BelastingBuddy site.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Health endpoint: used by Docker HEALTHCHECK, Kubernetes probes and blackbox exporter ---
    location = /healthz {
        access_log off;            # don't spam logs with probe traffic
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Metrics endpoint: nginx-prometheus-exporter reads this and turns it into Prometheus metrics ---
    # Only reachable from inside the pod/network (not published to the internet by Ingress).
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Next.js static export uses trailingSlash, so /return -> /return/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed JS/CSS files never change -> cache for a year
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

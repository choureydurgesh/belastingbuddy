# nginx config for the static BelastingBuddy site.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in the Server header or error pages (ZAP 10036)
    server_tokens off;

    # nginx normally DROPS server-level add_header lines in any location that has its own
    # add_header (like /_next/static below). ZAP found every JS/CSS file without nosniff.
    # "merge" (nginx 1.29.3+) makes locations add their headers on top of these instead.
    add_header_inherit merge;

    # --- Health endpoint: used by Docker HEALTHCHECK, Kubernetes probes and blackbox exporter ---
    location = /healthz {
        access_log off;            # don't spam logs with probe traffic
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Metrics endpoint: nginx-prometheus-exporter reads this and turns it into Prometheus metrics ---
    # Only reachable from inside the pod/network (not published to the internet by Ingress).
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Next.js static export uses trailingSlash, so /return -> /return/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed JS/CSS files never change -> cache for a year
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Security headers (checked by the OWASP ZAP scan in CI) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Only this site may load these files (blocks other sites from embedding them)
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Pages opened from this site (or that open it) can't reach into its window
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Browser features the app never uses are switched off
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Content Security Policy: where the browser may load code, styles, fonts and data from.
    #   script-src  'unsafe-inline': a static export has inline <script> tags with no nonce to use
    #               'wasm-unsafe-eval': tesseract.js (photo reading) runs WebAssembly
    #               cdnjs / jsdelivr: pdf.js and tesseract.js are loaded on demand from these CDNs
    #   worker-src  blob: pdf.js and tesseract.js start their workers from blob: URLs
    #   connect-src jsdelivr: tesseract downloads its language data
    #   style/font  Google Fonts (until the font is self-hosted, BEL-64)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# HorizontalPodAutoscaler: automatically add pods when CPU is high, remove when quiet.
# (Needs metrics-server installed in the cluster.)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: belastingbuddy
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: belastingbuddy }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }

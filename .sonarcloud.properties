# SonarCloud AUTOMATIC analysis settings. CI-based analysis (ci.yml `sonar` job) reads
# sonar-project.properties instead; delete this file once Automatic Analysis is switched off.

# Translation files repeat the structure of the English strings line by line,
# so they always look "duplicated". Keep them out of the duplication check only;
# they are still checked for bugs and code smells.
sonar.cpd.exclusions=src/lib/i18n/**

# =============================================================================
# GITHUB ACTIONS CONCEPTS in this file:
#   - triggers (on:)             - jobs run in PARALLEL by default
#   - matrix strategy            - caching
#   - reusable workflow (workflow_call) so pipeline.yml can re-use this file
# This is the "CI" half: prove the code is good BEFORE we build an image.
# =============================================================================
name: CI

on:
  pull_request:            # every PR is checked
  workflow_call:           # lets other workflows call this one (see pipeline.yml)
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: read           # least privilege: CI only needs to read the code

jobs:
  # ---- 1. Unit tests + build, on two Node versions at the same time (matrix) ----
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]     # README says "Node 20 or newer", so we prove both work
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `npm ci` = clean, reproducible install of the exact versions in package-lock.json.
      # --ignore-scripts: dependencies can't run their own install scripts on the runner (supply-chain safety).
      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck     # type check (catches bugs without running)
      - name: Run unit tests
        run: npm test              # the tax maths tests
      - name: Build the static site
        run: npm run build         # make sure the static export still builds

  # ---- 2. Lint the application code (ESLint: Next.js, React, React Hooks, a11y, TypeScript rules) ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: Lint the code (ESLint)
        run: npm run lint          # errors fail the job; warnings are shown but don't

  # ---- 3. Lint the Dockerfile (best-practice checker) ----
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      # Third-party actions are pinned to a full commit SHA: a tag can be moved to other code, a SHA can't.
      - name: Lint the Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ---- 4. Look for accidentally committed passwords / API keys ----
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # on PRs gitleaks lists the PR's commits through the API
    steps:
      - name: Check out full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # gitleaks must see full history, not just the last commit
      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 5. Known-vulnerable npm packages ----
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts
      # Fails on any HIGH/CRITICAL advisory except those listed, with a reason and a
      # review date, in .npm-audit-allowlist.json (see scripts/audit-gate.mjs)
      - name: Audit npm packages (high and critical, documented exceptions only)
        run: npm run audit:gate

  # ---- 6. Validate the infrastructure code too (no cloud credentials needed) ----
  iac-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Validate Kubernetes manifests (kustomize + kubeconform)
        run: |
          # Download over HTTPS only, and check the checksum before running the binary
          curl -sSL --proto '=https' --tlsv1.2 -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          for env in dev prod; do
            kubectl kustomize k8s/overlays/$env | ./kubeconform -strict -ignore-missing-schemas -summary
          done
      - name: Ansible syntax check
        run: |
          # Exact version, wheels only (no setup.py code runs). The full package includes community.general (ufw module).
          pip install --only-binary :all: ansible==14.5.0
          ansible-playbook -i localhost, --syntax-check ansible/site.yml

  # ---- 7. Misconfiguration scan of the infrastructure code (Trivy "config" mode) ----
  # Kubernetes manifests, Terraform and the Dockerfile are checked against security rules,
  # e.g. "container may run as root" or "SSH open to the whole internet".
  # Reviewed exceptions are inline `trivy:ignore:<ID>` comments with a reason (terraform/main.tf).
  iac-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Scan Kubernetes, Terraform and Dockerfile for misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: node_modules,.next,out
          severity: CRITICAL,HIGH
          exit-code: "1"             # fail on any HIGH/CRITICAL misconfiguration


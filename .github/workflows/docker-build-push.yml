# Reusable workflow: build the Docker image and push it to GitHub Container Registry (GHCR).
# GHCR needs NO extra secrets - the built-in GITHUB_TOKEN is enough (unlike Docker Hub).
name: Docker build & push

on:
  workflow_call:
    outputs:
      image:
        description: "Full image name (without tag)"
        value: ${{ jobs.build-and-push.outputs.image }}
      tag:
        description: "Tag that was pushed (short git SHA)"
        value: ${{ jobs.build-and-push.outputs.tag }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to ghcr.io
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name and tag
        id: vars
        run: |
          # Registry names must be lowercase, ${VAR,,} lower-cases in bash
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Tag = commit SHA, so every image maps to exactly one commit (traceable, rollback-able)
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Third-party actions are pinned to a full commit SHA (a tag can be moved, a SHA can't)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha         # reuse layers from previous runs
          cache-to: type=gha,mode=max

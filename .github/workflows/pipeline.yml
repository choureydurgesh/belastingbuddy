# =============================================================================
# THE MAIN CI/CD PIPELINE  (runs on every push to main)
#
#   CI  : ci.yml (tests, lint, scans)
#    |
#   build image -> push to GHCR
#    |
#   scan image (Trivy)
#    |
#   CD  : update image tag in git (k8s/overlays/prod)  --->  Argo CD sees the change
#                                                            and deploys it to Kubernetes
# This is "GitOps": the pipeline never runs kubectl. Git is the single source of truth.
# =============================================================================
name: Pipeline

on:
  push:
    branches: [main]
    # IMPORTANT: ignore our own gitops commit, otherwise we'd loop forever
    paths-ignore: ["k8s/overlays/prod/**", "**.md", "docs/**"]
  workflow_dispatch:

# Only one pipeline per branch at a time; newer push cancels the older run
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    # A called workflow can't ask for more than its caller grants:
    # ci.yml's secrets-scan job needs pull-requests: read (gitleaks)
    permissions:
      contents: read
      pull-requests: read

  build:
    needs: [ci]                # "needs" = run only after ci succeeded
    uses: ./.github/workflows/docker-build-push.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  scan:
    needs: [build]
    uses: ./.github/workflows/image-scan.yml
    with:
      image-ref: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
    permissions:
      contents: read
      packages: read

  # ---- CD: bump the image tag in git. Argo CD does the actual deploy. ----
  gitops-update:
    needs: [build, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push the commit
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set new image tag in the prod overlay
        working-directory: k8s/overlays/prod
        run: |
          # "kustomize edit set image" rewrites the newTag line in kustomization.yaml.
          # kustomize is preinstalled on GitHub's Ubuntu runners, so nothing is downloaded and executed here.
          kustomize edit set image belastingbuddy=${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: deploy ${{ needs.build.outputs.tag }} [skip ci]"
          git push

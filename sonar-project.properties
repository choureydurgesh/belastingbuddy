# =============================================================================
# SonarCloud (free plan, public repo): static analysis (SAST), code smells,
# duplication and test coverage. Run from CI by the `sonar` job in ci.yml;
# `-Dsonar.qualitygate.wait=true` makes the job fail when the quality gate fails.
# =============================================================================
sonar.organization=choureydurgesh
sonar.projectKey=choureydurgesh_belastingbuddy
sonar.projectName=belastingbuddy

# Everything in the repo is analysed (TypeScript, YAML, Terraform, Dockerfile, shell)...
sonar.sources=.
# ...except dependencies, build output, generated files and local test data
sonar.exclusions=node_modules/**,.next/**,out/**,coverage/**,test-files/**,preview.html,next-env.d.ts,**/*.test.ts

# Unit tests (node:test via tsx) live next to the code in src/lib
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

# Coverage report written by `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Coverage is measured for the logic layer (src/lib: tax maths, questions, scanning), which is
# what the unit tests cover. React components, pages, the Cloudflare /api functions, scripts and
# infrastructure have no unit tests (yet), so they are not counted towards coverage. All of it is
# still analysed for bugs, vulnerabilities and code smells.
sonar.coverage.exclusions=src/components/**,src/app/**,functions/**,server/**,scripts/**,**/*.mjs,**/*.config.*,k8s/**,terraform/**,ansible/**,observability/**,argocd/**,docker/**

# Translation files repeat the structure of the English strings line by line, so they always
# look "duplicated". Keep them out of the duplication check only; they are still checked for
# bugs and code smells. (Moved here from .sonarcloud.properties, which only automatic analysis reads.)
sonar.cpd.exclusions=src/lib/i18n/**

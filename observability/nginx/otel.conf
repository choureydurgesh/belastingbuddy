# Turns nginx's OpenTelemetry module ON. Only Docker Compose mounts this file (into conf.d/,
# i.e. the http {} block). The image and Kubernetes never load it, so there the module stays off.
#
#   every request -> one span -> OTel collector (OTLP gRPC :4317) -> Tempo     (traces)
#                                        \-> spanmetrics -> Prometheus          (RED metrics)
#   every request -> one JSON line with its trace_id -> collector -> Loki      (logs)

otel_exporter {
    endpoint otel-collector:4317;
}
otel_service_name belastingbuddy;

# Don't trace health checks and the metrics scrape (every 15s): they would drown real requests.
map $uri $otel_enabled {
    /healthz      off;
    /stub_status  off;
    default       on;
}
otel_trace $otel_enabled;
# Continue a trace if the caller sent a "traceparent" header, and pass it on.
otel_trace_context propagate;

# A second access log, as JSON, next to the normal one on stdout. The trace_id/span_id fields
# are what let Grafana jump from a trace to its log line (and back).
log_format otel_json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"remote_addr":"$remote_addr","user_agent":"$http_user_agent",'
    '"trace_id":"$otel_trace_id","span_id":"$otel_span_id"}';
access_log /var/log/nginx/otel/access.json otel_json;

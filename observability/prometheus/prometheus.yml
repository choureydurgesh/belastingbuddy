# PROMETHEUS CONCEPT: "pull" model. Prometheus visits each target every scrape_interval
# and reads its /metrics page. Each (job, instance) pair is one "target".
global:
  scrape_interval: 15s
  evaluation_interval: 15s     # how often alert rules are checked

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus monitors itself
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # nginx metrics (requests, connections) via the exporter
  - job_name: nginx
    static_configs: [{ targets: ["nginx-exporter:9113"] }]

  # OpenTelemetry collector's own metrics + anything apps send through it
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888", "otel-collector:8889"] }]

  # SRE: probe the site from outside like a user would -> probe_success (1 = up)
  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: ["http://app:8080/healthz", "http://app:8080/"] }]
    relabel_configs:            # standard blackbox trick: pass the URL as ?target=
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

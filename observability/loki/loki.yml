# Loki = log storage, queried with LogQL. Single-process, local-disk setup for learning.
# Logs arrive from the OTel collector over OTLP (http://loki:3100/otlp).
auth_enabled: false            # single tenant; never expose this port publicly

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore: { store: inmemory }

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: 168h       # keep 7 days, then delete (needs the compactor below)

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

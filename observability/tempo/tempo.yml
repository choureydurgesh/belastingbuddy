# Tempo = trace storage, queried with TraceQL. Single-process, local-disk setup for learning.
# Traces arrive from the OTel collector over OTLP gRPC (tempo:4317); Grafana reads on :3200.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }

compactor:
  compaction:
    block_retention: 168h      # keep 7 days of traces

storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }

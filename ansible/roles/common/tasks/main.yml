# Basic server hygiene
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600     # skip if updated within the last hour

- name: Install basic tools
  ansible.builtin.apt:
    name: [curl, ca-certificates, unattended-upgrades, ufw]
    state: present

- name: Allow SSH, app and Grafana through the OS firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "8080", "3000"]

- name: Enable firewall (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny

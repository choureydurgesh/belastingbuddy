# ARGO CD CONCEPT: an "Application" says "make the cluster look like THIS folder in THIS git repo".
# Argo CD compares git (desired state) with the cluster (live state) every ~3 minutes
# and fixes any difference. Change git -> cluster changes. Someone kubectl-edits -> Argo reverts it.
# Apply once:  kubectl apply -f argocd/app-belastingbuddy.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: belastingbuddy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/choureydurgesh/belastingbuddy.git
    targetRevision: main
    path: k8s/overlays/prod          # the folder CI updates
  destination:
    server: https://kubernetes.default.svc
    namespace: belastingbuddy
  syncPolicy:
    automated:
      prune: true        # delete resources removed from git
      selfHeal: true     # undo manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
